[pytest]
testpaths = tests
# So `pytest` works the same as `python -m pytest`: the project root on the path makes
# `trafficflow` and `app` importable without installing anything.
pythonpath = .

markers =
    slow: runs YOLO over a real clip; minutes, not seconds. Deselect with -m "not slow".

# The suite is fast by default. The three tests that actually run detection are marked
# slow and opted into with `pytest -m slow`, or run with everything else by `pytest -m ""`.
addopts = -m "not slow"
